on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libproj-dev libudunits2-dev libgdal-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Install renv and restore
        run: |
          Rscript -e 'install.packages("renv", repos="https://cloud.r-project.org")'
          Rscript -e 'renv::restore()'

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge, defaults
          activate-environment: diverse_web_env
          environment-file: environment.yml
          auto-activate-base: false

      - name: Verify conda environment
        shell: bash -el {0}
        run: |
          conda info
          conda list
          which python
          echo "CONDA_DEFAULT_ENV: $CONDA_DEFAULT_ENV"

      - name: Configure R for conda environment
        shell: bash -el {0}
        run: |
          Rscript -e "
          library(reticulate)
          use_condaenv('diverse_web_env', required = TRUE)
          py_config()
          "

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
